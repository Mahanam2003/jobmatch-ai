<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AutoApply</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #0d0d0d;
      color: #f1f1f1;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 20px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
    }
    .logo-wrap {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header-text p {
      font-size: 11px;
      color: #666;
      margin-top: 1px;
    }

    .btn {
      width: 100%;
      padding: 13px 0;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.1px;
    }
    .btn:hover:not(:disabled) { opacity: 0.88; }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .status {
      display: none;
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      background: #151515;
      border: 1px solid #222;
    }
    .status.success { color: #4ade80; border-left: 3px solid #22c55e; }
    .status.error   { color: #f87171; border-left: 3px solid #ef4444; }

    .divider {
      height: 1px;
      background: #1e1e1e;
      margin: 16px 0;
    }

    .profile-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .profile-card .name {
      font-size: 13px;
      font-weight: 600;
      color: #e5e7eb;
    }
    .profile-card .email {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }

    .note {
      margin-top: 12px;
      font-size: 10px;
      color: #3a3a3a;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-wrap">⚡</div>
    <div class="header-text">
      <h1>AutoApply</h1>
      <p>Job Form Auto-Filler</p>
    </div>
  </div>

  <button class="btn" id="fillBtn">Fill This Form</button>

  <div class="status" id="status"></div>

  <div class="divider"></div>

  <div class="profile-card">
    <div class="name">Mahan Amiri</div>
    <div class="email">mamiri2@uw.edu</div>
  </div>

  <div class="note">Yellow = needs manual input &nbsp;|&nbsp; Never auto-submits</div>

  <script src="popup.js"></script>
</body>
</html>
